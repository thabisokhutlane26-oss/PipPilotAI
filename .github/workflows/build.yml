              private var takeProfit = 1.17750

              private var robotEnabled = true
              private var demoEnabled = false
              private var positionOpen = false
              private var tradeDirection = "BUY"

              private var tradeCount = 0
              private var wins = 0
              private var losses = 0

              private lateinit var balanceText: TextView
              private lateinit var equityText: TextView
              private lateinit var floatingText: TextView
              private lateinit var priceText: TextView
              private lateinit var positionText: TextView
              private lateinit var historyText: TextView
              private lateinit var robotText: TextView
              private lateinit var signalText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(2, 6, 13)
                  window.navigationBarColor = Color.rgb(2, 6, 13)

                  buildDashboard()
                  startDemoEngine()
              }

