name: Build PipPilot AI v2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # 1. Get the GitHub repository
      - name: Checkout source
        uses: actions/checkout@v6

      # 2. Extract the Android project
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "PipPilotAI_Android_Project.zip" ]; then
            echo "ERROR: PipPilotAI_Android_Project.zip was not found."
            exit 1
          fi

          rm -rf app_project
          mkdir -p app_project

          unzip -o PipPilotAI_Android_Project.zip -d app_project

          echo "Project extracted successfully."
          find app_project -maxdepth 3 -type f | head -100

      # 3. Upgrade the app
      - name: Upgrade PipPilot AI
        shell: bash
        run: |
          set -e

          MAIN=$(find app_project/app/src/main \
            -type f \
            -name "MainActivity.kt" \
            | head -1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt was not found."
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN"

          PACKAGE=$(grep -m1 '^package ' "$MAIN" \
            | sed 's/^package //' \
            | tr -d '\r')

          if [ -z "$PACKAGE" ]; then
            PACKAGE="com.pippilot.ai"
          fi

          echo "Package: $PACKAGE"

          mkdir -p app_project/app/src/main/res/drawable

          # Background
          cat > app_project/app/src/main/res/drawable/pippilot_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:angle="270"
                  android:startColor="#02060D"
                  android:centerColor="#071728"
                  android:endColor="#03150F" />
          </shape>
          EOF

          # Robot icon
          cat > app_project/app/src/main/res/drawable/ic_pippilot_robot.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#07111F"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#22E676"
                  android:pathData="M30,26h48c6,0 10,4 10,10v36c0,6 -4,10 -10,10H30c-6,0 -10,-4 -10,-10V36c0,-6 4,-10 10,-10z" />

              <path
                  android:fillColor="#07111F"
                  android:pathData="M34,42h12v12H34z" />

              <path
                  android:fillColor="#07111F"
                  android:pathData="M62,42h12v12H62z" />

              <path
                  android:fillColor="#07111F"
                  android:pathData="M40,66h28v6H40z" />

              <path
                  android:fillColor="#22E676"
                  android:pathData="M51,14h6v12H51z" />

              <path
                  android:fillColor="#22E676"
                  android:pathData="M20,20h10v6H20z" />

              <path
                  android:fillColor="#22E676"
                  android:pathData="M78,20h10v6H78z" />
          </vector>
          EOF

          # Create upgraded MainActivity
          cat > /tmp/MainActivity.kt <<'EOF'
          package __PACKAGE__

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import java.util.Locale
          import kotlin.random.Random

          class MainActivity : Activity() {

              private val handler = Handler(Looper.getMainLooper())

              private var balance = 10000.0
              private var demoPrice = 1.17150
