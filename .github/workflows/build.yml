name: Build PipPilot AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o PipPilotAI_Android_Project.zip -d app_project

      - name: Fix Java and Kotlin compatibility
        run: |
          find app_project -name "*.gradle" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$file"
            sed -i 's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' "$file"
            sed -i "s/jvmTarget[[:space:]]*=[[:space:]]*['\"]1.8['\"]/jvmTarget = '17'/g" "$file"
            sed -i "s/jvmTarget[[:space:]]*=[[:space:]]*['\"]8['\"]/jvmTarget = '17'/g" "$file"
          done

          echo "Checking Gradle Java settings:"
          grep -R "VERSION_1_8\|VERSION_8\|jvmTarget" app_project --include="*.gradle" || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: app_project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipPilotAI-v1.0
          path: app_project/app/build/outputs/apk/debug/*.apk
