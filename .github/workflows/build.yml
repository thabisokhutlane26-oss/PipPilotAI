name: Build PipPilot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android project
        id: android
        shell: bash
        run: |
          set -e

          GRADLEW=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Repository structure:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -print | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "${{ steps.android.outputs.project_dir }}/gradlew"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.android.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "APK/AAB files found:"
            find "${{ steps.android.outputs.project_dir }}" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipPilot-REAL-LIVE
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
