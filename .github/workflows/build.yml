name: Build PipPilot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PipPilot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show repository structure
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 5 -type f | sort

      - name: Check Android project
        shell: bash
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "This repository does not currently contain a complete Android/Gradle project."
            echo "You need to add the Android project files before an APK can be built."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PipPilot-REAL-LIVE
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
